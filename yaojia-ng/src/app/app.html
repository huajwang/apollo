<mat-toolbar class="sticky-toolbar">
  <button mat-icon-button [matMenuTriggerFor]="menu" class="example-icon" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Yaojia Buy</span>
  <span class="example-spacer"></span>
  <button matIconButton class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
    <mat-icon>share</mat-icon>
  </button>
   <a [routerLink]="['/cart']" matIconButton class="example-icon" aria-label="Example icon-button with shopping cart icon" 
   [matBadge]="cartItemCount()" matBadgeColor="accent" [matBadgeHidden]="cartItemCount() === 0">
    <mat-icon>shopping_cart</mat-icon>
  </a>
</mat-toolbar>

<!-- User Menu -->
<mat-menu #menu="matMenu" class="user-menu">
  <!-- Section 1: Account -->
  <div class="menu-section account-section">
    <h3 matMenuLabel class="menu-label section-header account-header icon-only">
      @if (isLoggedIn()) {
        <mat-icon class="menu-icon user-logged-in">account_circle</mat-icon>
      } @else {
        <mat-icon class="menu-icon user-guest">person_outline</mat-icon>
      }
    </h3>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">loyalty</mat-icon>
      <span>积分 (Points)</span>
    </button>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">card_giftcard</mat-icon>
      <span>礼品卡 (Gift Card)</span>
    </button>
  </div>

  <!-- Divider -->
  <mat-divider></mat-divider>

  <!-- Section 2: Settings -->
  <div class="menu-section settings-section">
    <h3 matMenuLabel class="menu-label section-header settings-header icon-only">
      <mat-icon class="menu-icon">settings</mat-icon>
    </h3>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">location_on</mat-icon>
      <span>Address</span>
    </button>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">history</mat-icon>
      <span>Order History</span>
    </button>
  </div>
</mat-menu>

<router-outlet></router-outlet>
