<mat-card class="product-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="product-header-image"></div>
    <mat-card-title>{{ product().productName }}</mat-card-title>
    <mat-card-subtitle>New</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="product().imageUrl" alt="Photo of {{ product().productName }}">
  <mat-card-content>
    <mat-card-subtitle>{{ product().price | currency: 'CAD'}}</mat-card-subtitle>
    <p>{{ product().description }}</p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton>LIKE</button>
    <button matButton>SHARE</button>
  </mat-card-actions>
</mat-card>
