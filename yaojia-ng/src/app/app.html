<mat-toolbar class="sticky-toolbar">
  <button mat-icon-button [matMenuTriggerFor]="menu" class="example-icon" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-title" [routerLink]="['/']">Yaojia Buy</span>
  <span class="example-spacer"></span>
  
  <!-- Search Icon -->
  <button mat-icon-button [routerLink]="['/search']" class="example-icon" aria-label="Search">
    <mat-icon>search</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="shareMenu" class="example-icon favorite-icon" aria-label="Share">
    <mat-icon>share</mat-icon>
  </button>
   <a [routerLink]="['/cart']" matIconButton class="example-icon" aria-label="Example icon-button with shopping cart icon" 
   [matBadge]="cartItemCount()" matBadgeColor="accent" [matBadgeHidden]="cartItemCount() === 0">
    <mat-icon>shopping_cart</mat-icon>
  </a>
</mat-toolbar>

<!-- User Menu -->
<mat-menu #menu="matMenu" class="user-menu">
  <!-- Section 1: Account -->
  <div class="menu-section account-section">
    <h3 matMenuLabel class="menu-label section-header account-header icon-only">
      @if (isLoggedIn()) {
        <div class="logged-in-header">
          <mat-icon class="menu-icon user-logged-in">account_circle</mat-icon>
          <span class="username">{{ currentUser()?.name }}</span>
        </div>
      } @else {
        <div class="guest-header">
          <mat-icon class="menu-icon user-guest">person_outline</mat-icon>
          <button mat-button color="primary" class="login-btn" (click)="authService.loginWithProvider('github')">
            Login
          </button>
        </div>
      }
    </h3>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">loyalty</mat-icon>
      <span>Points</span>
    </button>
    <button mat-menu-item class="menu-item">
      <mat-icon class="item-icon">card_giftcard</mat-icon>
      <span>Gift Card</span>
    </button>
  </div>

  <!-- Divider -->
  <mat-divider></mat-divider>

  <!-- Section 2: Settings -->
  <div class="menu-section settings-section">
    <h3 matMenuLabel class="menu-label section-header settings-header icon-only">
      <mat-icon class="menu-icon">settings</mat-icon>
    </h3>
    <button mat-menu-item class="menu-item" [routerLink]="['/address']">
      <mat-icon class="item-icon">location_on</mat-icon>
      <span>Address</span>
    </button>
    <button mat-menu-item class="menu-item" [routerLink]="['/orders']">
      <mat-icon class="item-icon">history</mat-icon>
      <span>Order History</span>
    </button>
  </div>
</mat-menu>

<!-- Share Menu -->
<mat-menu #shareMenu="matMenu" class="share-menu">
  <button mat-menu-item (click)="shareToWeChat()">
    <mat-icon>wechat</mat-icon>
    <span>WeChat</span>
  </button>
  <button mat-menu-item (click)="shareToTikTok()">
    <mat-icon>video_library</mat-icon>
    <span>TikTok</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="shareNative()">
    <mat-icon>share</mat-icon>
    <span>More Options</span>
  </button>
</mat-menu>

<router-outlet></router-outlet>
